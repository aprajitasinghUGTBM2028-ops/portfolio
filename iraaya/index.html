<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IRAAYA — For all that, you are</title>
<meta name="description" content="IRAAYA — something to wear for all of it. Coming soon. Join the list." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="nav" id="nav">
  <a class="nav__brand" href="#top">
    <img src="assets/logo-mark.png" alt="" />
    <span>IRAAYA</span>
  </a>
  <a class="nav__link" href="#join">Join the list</a>
</header>

<main class="hero" id="top">
  <!-- the tag hangs by the thread built into the logo itself -->
  <div class="hang">
    <div class="drop">
      <div class="pendulum" id="pendulum" role="img" aria-label="IRAAYA — twin sunburst tag" title="Give it a swing">
        <img class="tag" src="assets/logo-tag.png" alt="IRAAYA — for all that, you are" draggable="false" />
      </div>
    </div>
  </div>

  <div class="hero__copy">
    <h1 class="sr-only">IRAAYA — for all that, you are</h1>
    <span class="eyebrow">Coming soon · 2026</span>
    <p class="lede">Dressing that begins with you — <em>your shape, your skin, your moment.</em></p>

    <form class="join" id="joinForm" novalidate>
      <input type="email" id="joinEmail" name="email" placeholder="you@iraaya.club" required aria-label="Email address" />
      <button type="submit">Join the list</button>
    </form>
    <p class="microcopy" id="joinNote">Be first through the door. No spam — one note when we open.</p>
  </div>

  <a class="scrollcue" href="#join" aria-hidden="true">tap the tag ✦</a>
</main>

<footer class="foot" id="join">
  <span>© <span id="year"></span> IRAAYA</span>
  <span class="foot__hint">your shape · your skin · your occasion</span>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // nav gains a backdrop once you scroll
  const nav = document.getElementById('nav');
  addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 12));

  // tap the tag to replay the drop from the ceiling
  const drop = document.querySelector('.drop');
  const pend = document.getElementById('pendulum');
  function replay(){
    drop.style.animation = 'none'; pend.style.animation = 'none';
    void drop.offsetWidth;
    drop.style.animation = 'drop 1.5s cubic-bezier(.3,.72,.2,1) both';
    pend.style.animation = 'swing 4s 1.4s cubic-bezier(.36,0,.2,1) both, sway 7.5s 5.2s ease-in-out infinite';
  }
  pend.addEventListener('click', replay);

  // waitlist (demo: validates + remembers locally; wire to a real endpoint later)
  const form = document.getElementById('joinForm');
  const email = document.getElementById('joinEmail');
  const note = document.getElementById('joinNote');
  const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  try {
    if (localStorage.getItem('iraaya-joined')) {
      note.textContent = "You're already on the list ✦ hang tight.";
      note.className = 'microcopy is-good';
      form.querySelector('button').textContent = 'Joined ✓';
    }
  } catch (e) {}
  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const v = email.value.trim();
    if (!valid.test(v)) {
      note.textContent = 'That email looks a little off — mind checking it?';
      note.className = 'microcopy is-err';
      email.focus(); return;
    }
    try { localStorage.setItem('iraaya-joined', v); } catch (e) {}
    note.textContent = "You're on the list ✦ we'll be in touch.";
    note.className = 'microcopy is-good';
    form.reset();
    form.querySelector('button').textContent = 'Joined ✓';
  });
</script>
</body>
</html>
